name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NODE_IMAGE: ghcr.io/rubel0278-bot/quantus-node
  MINER_IMAGE: ghcr.io/rubel0278-bot/quantus-miner
  DASHBOARD_IMAGE: ghcr.io/rubel0278-bot/quantus-dashboard

jobs:
  build-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Quantus Node image
        uses: docker/build-push-action@v5
        with:
          context: ./node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.NODE_IMAGE }}:latest
            ${{ env.NODE_IMAGE }}:v1.0.2-Qm

  build-miner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Quantus Miner image
        uses: docker/build-push-action@v5
        with:
          context: ./miner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MINER_IMAGE }}:latest
            ${{ env.MINER_IMAGE }}:v4.2.0

  build-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Quantus Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:v1.0.0

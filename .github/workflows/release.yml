name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate app structure
        run: |
          test -f app.json
          test -f install.sh
          test -f update
          test -f config
          test -f service/quantus-node.service
          echo "All required files present"

      - name: Create release archive
        run: |
          tar -czf quantus-node-app-${GITHUB_REF_NAME}.tar.gz \
            --exclude='.git' \
            --exclude='data' \
            --exclude='bin' \
            --exclude='logs' \
            .

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: quantus-node-app-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

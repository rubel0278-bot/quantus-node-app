<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>

  <!-- Network connections -->
  <g stroke="#00d4ff" stroke-width="3" opacity="0.6">
    <line x1="256" y1="76" x2="256" y2="136"/>
    <line x1="256" y1="376" x2="256" y2="436"/>
    <line x1="76" y1="256" x2="136" y2="256"/>
    <line x1="376" y1="256" x2="436" y2="256"/>
    <line x1="128" y1="128" x2="170" y2="170"/>
    <line x1="342" y1="342" x2="384" y2="384"/>
    <line x1="384" y1="128" x2="342" y2="170"/>
    <line x1="170" y1="342" x2="128" y2="384"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#00d4ff">
    <circle cx="256" cy="76" r="16"/>
    <circle cx="256" cy="436" r="16"/>
    <circle cx="76" cy="256" r="16"/>
    <circle cx="436" cy="256" r="16"/>
    <circle cx="128" cy="128" r="12"/>
    <circle cx="384" cy="384" r="12"/>
    <circle cx="384" cy="128" r="12"/>
    <circle cx="128" cy="384" r="12"/>
  </g>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>

  <!-- Inner connections -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.5">
    <line x1="256" y1="136" x2="256" y2="176"/>
    <line x1="256" y1="336" x2="256" y2="376"/>
    <line x1="136" y1="256" x2="176" y2="256"/>
    <line x1="336" y1="256" x2="376" y2="256"/>
  </g>

  <!-- Inner nodes -->
  <g fill="#00d4ff">
    <circle cx="256" cy="136" r="10"/>
    <circle cx="256" cy="376" r="10"/>
    <circle cx="136" cy="256" r="10"/>
    <circle cx="376" cy="256" r="10"/>
  </g>

  <!-- Central node -->
  <circle cx="256" cy="256" r="56" fill="url(#nodeGrad)" filter="url(#glow)"/>

  <!-- Q letter -->
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0a1628" text-anchor="middle">Q</text>

  <!-- Text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00d4ff" text-anchor="middle">QUANTUS NODE</text>
</svg>
